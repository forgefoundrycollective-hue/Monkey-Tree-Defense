    // card body
    cx.fillStyle = hot ? "rgba(255,255,255,0.97)" : "rgba(255,255,255,0.9)";
    roundRect(x, CARD.y, CARD.w, CARD.h, 18); cx.fill();
    cx.strokeStyle = b.tint; cx.lineWidth = hot ? 5 : 3;
    roundRect(x, CARD.y, CARD.w, CARD.h, 18); cx.stroke();
    // tinted emblem well
    cx.fillStyle = b.tint;
    cx.globalAlpha = 0.18;
    cx.beginPath(); cx.arc(x + CARD.w / 2, CARD.y + 62, 38, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
    drawUpgradeIcon(b, x + CARD.w / 2, CARD.y + 62);
    // wording
    txt(b.name, x + CARD.w / 2, CARD.y + 122, 19, "#123A44", "center", false);
    wrapText(b.desc, x + CARD.w / 2, CARD.y + 148, CARD.w - 30, 13, "#43626B");
    // stack progress
    const owned = lv(b.id);
    for (let k = 0; k < b.max; k++) {
      cx.fillStyle = k < owned ? b.tint : k === owned ? "#9FB6BD" : "rgba(0,0,0,0.12)";
      cx.beginPath(); cx.arc(x + CARD.w / 2 + (k - (b.max - 1) / 2) * 14, CARD.y + CARD.h - 22, 4.5, 0, TAU); cx.fill();
    }
    if (owned) txt(ROMAN[owned] + " → " + ROMAN[next], x + CARD.w - 14, CARD.y + 20, 12, b.tint, "right", false);
    txt(String(i + 1), x + 16, CARD.y + 20, 15, "#9FB6BD", "left", false);
    cx.restore();
  }
  txt(touchMode ? "tap a card" : "click a card, or press 1 · 2 · 3", W / 2, CARD.y + CARD.h + 40, 16, "#FFE9A8", "center");
}
// Tiny word-wrapper for card copy.
function wrapText(str, cxCenter, y, maxW, size, color) {
  cx.font = `bold ${size}px "Trebuchet MS", Verdana, sans-serif`;
  const words = str.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (cx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => txt(l, cxCenter, y + i * (size + 4), size, color, "center", false));
}

// The title card's copy. Only has to cover what surprises people — the full
// reference lives in the pause menu.
function titleLines() {
  return [
    [touchMode ? "▲ ▼ buttons — climb up & down" : "W / S  or  ▲ ▼  — climb up & down", "#D8F7FF"],
    [touchMode ? "DRAG to aim, RELEASE to throw · 🥥 button for coconuts"
               : "CLICK — banana · RIGHT-CLICK / E — coconut (BOOM)", "#FFE9A8"],
    ["Coconuts & clams are heavier — they arc shorter than bananas", "#FFD8B8"],
    ["Only " + BANANA_MAX + " bananas at a time — the bunch regrows, so pace them", "#FFEBC2"],
    ["You can't throw straight down — climb low to defend low!", "#FFC9A8"],
    [touchMode ? "Stick button — bonk anything on the ground when you're low"
               : "F — stick bonk (only reaches the ground when you're low)", "#FFCFA8"],
    [touchMode ? "Forgot a control? ⏸ → Controls, any time."
                : "Forgot a control? Press P → Controls, any time.", "#C9FFB8"],
  ];
}
// Panel geometry for the title card, shared with the test seam. Measuring the
// copy beats guessing a width: these lines get edited often, and a fixed panel
// left the longest ones hanging out over the sky.
function titlePanelMetrics(lines) {
  const cy = 338, lh = 25, padX = 20;
  cx.font = 'bold 16px "Trebuchet MS", Verdana, sans-serif';
  const textW = Math.max(...lines.map(([t]) => cx.measureText(t).width));
  const w = Math.min(W - 24, textW + padX * 2);
  const x = Math.min(W / 2 - 40, W - 12 - w);
  return { cy, lh, padX, textW, w, x };
}
function drawTitle() {
  cx.fillStyle = "rgba(8,40,60,0.18)";
  cx.fillRect(0, 0, W, H);
  const letters = "MONKEY TREE DEFENSE";
  const cols = ["#FFD23B", "#FF8A5C", "#8CFF6B", "#7FE3FF", "#FF9CCB"];
  cx.save();
  cx.translate(W / 2, 120);
  cx.font = 'bold 52px "Trebuchet MS", Verdana, sans-serif';
  let total = 0;
  const widths = [...letters].map(ch => cx.measureText(ch).width);
  total = widths.reduce((a, b) => a + b, 0);
  let lx = -total / 2;
  [...letters].forEach((ch, i) => {
    const yy = Math.sin(G.t * 3 + i * 0.5) * 8;
    txt(ch, lx + widths[i] / 2, yy, 52, cols[i % cols.length], "center");
    lx += widths[i];
  });
  cx.restore();

  txt("The beach bullies want your tree. Say it with bananas. 🍌", W / 2, 185, 20, "#FFFFFF", "center");

  const pulse = 1 + Math.sin(G.t * 5) * 0.06;
  cx.save();
  cx.translate(W / 2 + 130, 300); cx.scale(pulse, pulse);
  txt(touchMode ? "TAP TO START!" : "CLICK TO START!", 0, 0, 36, "#FFFFFF", "center");
  cx.restore();

  const lines = titleLines();
  const m = titlePanelMetrics(lines);
  cx.fillStyle = "rgba(10,45,60,0.55)";
  roundRect(m.x, m.cy - 24, m.w, lines.length * m.lh + 28, 16); cx.fill();
  lines.forEach(([text, col], i) => txt(text, m.x + m.padX, m.cy + i * m.lh, 16, col, "left"));
  // what the game remembers about you, right where a returning player looks
  if (profile.runs > 0) {
    txt("Best wave " + profile.bestWave + "   ·   Best score " + Math.max(G.hi, profile.bestScore) +
        "   ·   " + profile.runs + (profile.runs === 1 ? " run" : " runs"),
        W / 2, 214, 16, "#FFE9A8", "center");
    const earned = MEDALS.filter(m => hasMedal(m.id)).length;
    const shelfY = 244, gap = 26, sx = W / 2 - (MEDALS.length - 1) * gap / 2;
    MEDALS.forEach((m, i) => drawMedalIcon(sx + i * gap, shelfY, 0.62, hasMedal(m.id)));
    txt(earned + " / " + MEDALS.length + " medals" + (earned < MEDALS.length ? "  ·  P → Medals to see the rest" : "  ·  all of them!"),
        W / 2, shelfY + 26, 13, "#C9FFB8", "center", false);
  }
}
// -------------------------- Run summary ---------------------------
// The game never ends, so losing a tree is the only natural punctuation.
// This rides along with the fall-and-sprint sequence rather than blocking
// it, so the player reads their run while the monkey is still running.
function drawSummary() {
  const s = G.summary;
  if (!s) return;
  if (G.state !== "falling" && G.state !== "running" && G.state !== "arrive") return;
  const t = G.tree.fallT || 0;
  const inT = clamp((t - 1.1) / 0.45, 0, 1);
  if (inT <= 0) return;
  const w = 330, h = 208 + (s.upgrades.length ? 26 : 0);
  const x = W / 2 - w / 2, y = 92 - (1 - inT) * 26;
  cx.save();
  cx.globalAlpha = inT;
  cx.fillStyle = "rgba(9,38,52,0.9)";
  roundRect(x, y, w, h, 18); cx.fill();
  cx.strokeStyle = "rgba(255,233,168,0.5)"; cx.lineWidth = 2;
  roundRect(x, y, w, h, 18); cx.stroke();

  txt("TREE #" + s.tree, W / 2, y + 30, 24, "#FFE9A8", "center");
  txt("stood until wave " + s.wave, W / 2, y + 56, 15, "#D8F7FF", "center");

  const rows = [
    ["Kills", String(s.kills)],
    ["Best combo", s.bestCombo > 1 ? "x" + s.bestCombo : "—"],
    ["Points", String(s.points)],
    ["Held out", s.secs + "s"],
  ];
  rows.forEach(([k, v], i) => {
    const ry = y + 84 + i * 24;
    txt(k, x + 24, ry, 15, "#9FC4CE", "left", false);
    txt(v, x + w - 24, ry, 16, "#FFFFFF", "right", false);
  });
  if (s.upgrades.length) {
    txt(s.upgrades.join(" · "), W / 2, y + 84 + rows.length * 24 + 12, 12, "#FFD8B8", "center", false);
  }
  txt("resuming at wave " + s.next, W / 2, y + h - 20, 14, "#8CFF6B", "center", false);
  cx.restore();
}

// A little scallop-shell medal on a ribbon.
function drawMedalIcon(x, y, sc = 1, earned = true) {
  cx.save();
  cx.translate(x, y); cx.scale(sc, sc);
  cx.fillStyle = earned ? "#E2673F" : "rgba(255,255,255,0.16)";
  cx.beginPath(); cx.moveTo(-8, -14); cx.lineTo(-3, -2); cx.lineTo(-13, -4); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(8, -14); cx.lineTo(3, -2); cx.lineTo(13, -4); cx.closePath(); cx.fill();
  cx.fillStyle = earned ? "#FFD23B" : "rgba(255,255,255,0.22)";
  cx.beginPath(); cx.arc(0, 4, 11, 0, TAU); cx.fill();
  cx.strokeStyle = earned ? "#C99A1C" : "rgba(255,255,255,0.28)";
  cx.lineWidth = 1.6;
  cx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.42;
    cx.moveTo(0, 10); cx.lineTo(Math.cos(a) * 9, 4 + Math.sin(a) * 9);
  }
  cx.stroke();
  cx.restore();
}
function drawMedalsPage() {
  txt("MEDALS", W / 2, 56, 38, "#FFFFFF", "center");
  txt(medalCount() + " of " + MEDALS.length + " earned", W / 2, 86, 15, "#D8F7FF", "center", false);
  const colW = 440, rowH = 40, cols = 2;
  const gridW = colW * cols, gx = W / 2 - gridW / 2, gy = 108;
  MEDALS.forEach((m, i) => {
    const cxi = i % cols, ryi = (i / cols) | 0;
    const x = gx + cxi * colW, y = gy + ryi * rowH;
    const got = hasMedal(m.id);
    drawMedalIcon(x + 22, y + 18, 0.82, got);
    txt(m.name, x + 44, y + 11, 15, got ? "#FFD23B" : "#8FA6AE", "left", false);
    txt(got && m.perk ? m.perk : m.desc, x + 44, y + 28, 12,
        got ? (m.perk ? "#C9FFB8" : "#9FC4CE") : "#7C929A", "left", false);
  });
  const sy = gy + Math.ceil(MEDALS.length / cols) * rowH + 16;
  txt("Lifetime  ·  " + profile.runs + " runs  ·  best wave " + profile.bestWave +
      "  ·  best score " + profile.bestScore, W / 2, sy, 14, "#D8F7FF", "center", false);
  txt(profile.kills + " knockouts  ·  " + profile.kings + " Kings felled  ·  " +
      profile.trees + " trees planted  ·  " + profile.clams + " clams thrown",
      W / 2, sy + 20, 14, "#9FC4CE", "center", false);

  const b = backBtnRect(), hot = pauseMenu.hover === 0;
  cx.fillStyle = hot ? "rgba(255,255,255,0.96)" : "rgba(255,255,255,0.86)";
  roundRect(b.x, b.y, b.w, b.h, 12); cx.fill();
  if (hot) { cx.strokeStyle = "#FFD23B"; cx.lineWidth = 3; roundRect(b.x, b.y, b.w, b.h, 12); cx.stroke(); }
  txt("Back", b.x + b.w / 2, b.y + b.h / 2, 18, "#123A44", "center", false);
}

// --------------------------- Pause menu ---------------------------
const pauseMenu = { hover: -1, page: "menu" };
const PAUSE_ROW = { w: 320, h: 42, gap: 9, top: 182 };
// Built fresh each frame so the on/off labels always reflect current state.
function pauseRows() {
  return [
    { label: "Resume", value: null, act: () => togglePause() },
    { label: "Controls", value: null, act: () => { pauseMenu.page = "controls"; pauseMenu.hover = -1; } },
    { label: "Medals", value: null, act: () => { pauseMenu.page = "medals"; pauseMenu.hover = -1; } },
    { label: "Sound", value: !muted, act: () => toggleMute() },
    { label: "Screen shake", value: opts.shake, act: () => setOpt("shake", !opts.shake) },
    { label: "Aim preview", value: opts.preview, act: () => setOpt("preview", !opts.preview) },
  ];
}
// The controls reference, reachable mid-run. Players who skipped the title
// card (or just forgot which key swings the stick) can look it up here
// instead of losing a run to it.
function controlRows() {
  return touchMode ? [
    ["▲ ▼", "climb up and down the trunk"],
    ["drag", "aim — the arc preview follows your finger"],
    ["release", "throw a banana"],
    ["🥥", "coconut — heavy, so it flies a shorter arc, but it explodes"],
    ["stick", "bonk — only reaches the ground when you're climbed down low"],
    ["🦪", "throw a found clam — heavy arc, banishes that species"],
    ["⏸", "pause"],
  ] : [
    ["W / S", "climb up and down the trunk (also ↑ ↓)"],
    ["mouse", "aim — the dotted arc shows where the throw lands"],
    ["click", "throw a banana (also Space) — limited stash, regrows"],
    ["E / RMB", "coconut — heavy, so it flies a shorter arc, but it explodes"],
    ["F", "stick bonk — only reaches the ground when you're climbed down low"],
    ["Q", "throw a found clam — heavy arc, banishes that species"],
    ["1 2 3", "pick an upgrade when the cards come up"],
    ["M / P", "mute · pause (Esc also pauses)"],
  ];
}
const BACK_BTN = { w: 150, h: 40 };
function backBtnRect() { return { x: W / 2 - BACK_BTN.w / 2, y: H - 72, w: BACK_BTN.w, h: BACK_BTN.h }; }
function pauseRowAt(x, y) {
  if (pauseMenu.page !== "menu") {
    const b = backBtnRect();
    return (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) ? 0 : -1;
  }
  const rows = pauseRows();
  for (let i = 0; i < rows.length; i++) {
    const ry = PAUSE_ROW.top + i * (PAUSE_ROW.h + PAUSE_ROW.gap);
    if (x >= W / 2 - PAUSE_ROW.w / 2 && x <= W / 2 + PAUSE_ROW.w / 2 && y >= ry && y <= ry + PAUSE_ROW.h) return i;
  }
  return -1;
}
function pauseHit(x, y) {
  const i = pauseRowAt(x, y);
  if (i < 0) return;      // clicking off the menu no longer resumes by accident
  if (pauseMenu.page !== "menu") { pauseMenu.page = "menu"; sfx.pop(); return; }
  pauseRows()[i].act();
  sfx.pop();
}
function drawControlsPage() {
  txt("CONTROLS", W / 2, 74, 40, "#FFFFFF", "center");
  const rows = controlRows();
  const panelW = 640, x = W / 2 - panelW / 2, top = 108;
  const rh = 34;
  cx.fillStyle = "rgba(255,255,255,0.07)";
  roundRect(x, top - 12, panelW, rows.length * rh + 24, 14); cx.fill();
  rows.forEach(([key, what], i) => {
    const y = top + i * rh + rh / 2;
    // key chip
    cx.font = 'bold 14px "Trebuchet MS", Verdana, sans-serif';
    const kw = Math.max(58, cx.measureText(key).width + 22);
    cx.fillStyle = "rgba(255,233,168,0.92)";
    roundRect(x + 16, y - 13, kw, 26, 8); cx.fill();
    txt(key, x + 16 + kw / 2, y, 14, "#123A44", "center", false);
    txt(what, x + 16 + kw + 14, y, 15, "#E8F6FA", "left", false);
  });
  txt("Coconuts and clams are heavier than bananas — they arc shorter, so aim higher.",
      W / 2, top + rows.length * rh + 26, 14, "#FFD8B8", "center", false);

  const b = backBtnRect(), hot = pauseMenu.hover === 0;
  cx.fillStyle = hot ? "rgba(255,255,255,0.96)" : "rgba(255,255,255,0.86)";
  roundRect(b.x, b.y, b.w, b.h, 12); cx.fill();
  if (hot) { cx.strokeStyle = "#FFD23B"; cx.lineWidth = 3; roundRect(b.x, b.y, b.w, b.h, 12); cx.stroke(); }
  txt("Back", b.x + b.w / 2, b.y + b.h / 2, 18, "#123A44", "center", false);
}
function drawPaused() {
  cx.fillStyle = "rgba(8,30,45,0.82)";
  cx.fillRect(0, 0, W, H);
  if (pauseMenu.page === "controls") { drawControlsPage(); return; }
  if (pauseMenu.page === "medals") { drawMedalsPage(); return; }
  txt("PAUSED", W / 2, 132, 46, "#FFFFFF", "center");

  const rows = pauseRows();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], hot = pauseMenu.hover === i;
    const x = W / 2 - PAUSE_ROW.w / 2, y = PAUSE_ROW.top + i * (PAUSE_ROW.h + PAUSE_ROW.gap);
    cx.fillStyle = hot ? "rgba(255,255,255,0.96)" : "rgba(255,255,255,0.86)";
    roundRect(x, y, PAUSE_ROW.w, PAUSE_ROW.h, 12); cx.fill();
    if (hot) { cx.strokeStyle = "#FFD23B"; cx.lineWidth = 3; roundRect(x, y, PAUSE_ROW.w, PAUSE_ROW.h, 12); cx.stroke(); }
    txt(r.label, x + 18, y + PAUSE_ROW.h / 2, 19, "#123A44", "left", false);
    if (r.value !== null) {
      // pill switch
      const px = x + PAUSE_ROW.w - 74, py = y + PAUSE_ROW.h / 2 - 12;
      cx.fillStyle = r.value ? "#5FCB57" : "#B9C6CB";
      roundRect(px, py, 56, 24, 12); cx.fill();
      cx.fillStyle = "#FFFFFF";
      cx.beginPath(); cx.arc(px + (r.value ? 44 : 12), py + 12, 9, 0, TAU); cx.fill();
      txt(r.value ? "ON" : "OFF", px + (r.value ? 20 : 34), py + 12, 10, r.value ? "#2C7A2B" : "#5C6D73", "center", false);
    }
  }
  txt(touchMode ? "tap Resume to keep going" : "P or Esc to resume", W / 2, PAUSE_ROW.top + rows.length * (PAUSE_ROW.h + PAUSE_ROW.gap) + 24, 15, "#D8F7FF", "center");
}

requestAnimationFrame(frame);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Monkey Tree Defense 🐵🌴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐵</text></svg>">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#083a52; }
  canvas { display:block; touch-action:none; cursor:crosshair; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* ================================================================
   MONKEY TREE DEFENSE
   A bright & playful beach-defense game.
   Everything (art, sound, music) is generated in code — no assets.
   ================================================================ */

// ------------------------- Canvas / view -------------------------
const W = 960, H = 540;                 // logical resolution
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.floor(innerWidth  * view.dpr);
  cv.height = Math.floor(innerHeight * view.dpr);
  cv.style.width  = innerWidth + "px";
  cv.style.height = innerHeight + "px";
  view.scale = Math.min(innerWidth / W, innerHeight / H);
  view.ox = (innerWidth  - W * view.scale) / 2;
  view.oy = (innerHeight - H * view.scale) / 2;
}
addEventListener("resize", resize);
resize();

// --------------------------- Utilities ---------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];
// localStorage can throw in sandboxed iframes — degrade to in-memory
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return this._m && this._m[k]; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { (this._m = this._m || {})[k] = v; } },
};
// Player options. Screen shake defaults off when the OS asks for reduced
// motion, and every choice persists across sessions.
const prefersReducedMotion = (() => {
  try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
})();
const opts = {
  shake: store.get("mtd_shake") !== null ? store.get("mtd_shake") === "1" : !prefersReducedMotion,
  preview: store.get("mtd_preview") !== null ? store.get("mtd_preview") === "1" : true,
};
function setOpt(k, v) { opts[k] = v; store.set("mtd_" + k, v ? "1" : "0"); }

// --------------------------- Profile -----------------------------
// What the game remembers between runs. A run is otherwise self-contained,
// so this is the only thing that makes playing twice different from playing
// once: lifetime tallies, medals, and the small head starts they grant.
const PROFILE_KEY = "mtd_profile";
function blankProfile() {
  return { runs: 0, waves: 0, bestWave: 1, bestScore: 0, kills: 0, kings: 0,
           clams: 0, trees: 0, medals: {} };
}
function loadProfile() {
  let saved = {};
  try { saved = JSON.parse(store.get(PROFILE_KEY) || "{}") || {}; } catch (e) { saved = {}; }
  return Object.assign(blankProfile(), saved, { medals: saved.medals || {} });
}
let profile = loadProfile();
function saveProfile() { store.set(PROFILE_KEY, JSON.stringify(profile)); }
function resetProfile() { profile = blankProfile(); saveProfile(); }

// Medals are recognition first. A few also grant a small, clearly stated
// head start — deliberately modest, so a veteran opens a little stronger
// without the early waves becoming a formality.
const MEDALS = [
  { id: "sprout",  name: "Sprout",          desc: "Clear your first wave",       test: p => p.waves >= 1 },
  { id: "wave10",  name: "Double Digits",   desc: "Reach wave 10",               test: p => p.bestWave >= 10 },
  { id: "wave20",  name: "Beach Veteran",   desc: "Reach wave 20",               test: p => p.bestWave >= 20,
    perk: "+10 max tree HP" },
  { id: "wave30",  name: "Island Legend",   desc: "Reach wave 30",               test: p => p.bestWave >= 30,
    perk: "+10 max tree HP" },
  { id: "king1",   name: "Regicide",        desc: "Fell King Pincher",           test: p => p.kings >= 1,
    perk: "+1 banana in your bunch" },
  { id: "king10",  name: "Crown Collector", desc: "Fell 10 Kings",               test: p => p.kings >= 10,
    perk: "+1 banana in your bunch" },
  { id: "clams",   name: "Beachcomber",     desc: "Throw 10 clams",              test: p => p.clams >= 10,
    perk: "clams wash up more often" },
  { id: "arbor",   name: "Arborist",        desc: "Plant 10 trees",              test: p => p.trees >= 10,
    perk: "+10 max tree HP" },
  { id: "kills",   name: "Fruit Salad",     desc: "500 lifetime knockouts",      test: p => p.kills >= 500 },
  { id: "roller",  name: "High Roller",     desc: "Score 25,000 in a single run", test: p => p.bestScore >= 25000 },
];
const hasMedal = id => !!profile.medals[id];
const medalCount = () => MEDALS.filter(m => hasMedal(m.id)).length;
// Perks earned from medals, folded into the derived stats below.
const perkBananas = () => (hasMedal("king1") ? 1 : 0) + (hasMedal("king10") ? 1 : 0);
const perkTreeHp  = () => (hasMedal("wave20") ? 10 : 0) + (hasMedal("wave30") ? 10 : 0) + (hasMedal("arbor") ? 10 : 0);
const perkClam    = () => (hasMedal("clams") ? 0.1 : 0);

// Called whenever a lifetime tally moves. Announces anything newly earned.
function checkMedals() {
  for (const m of MEDALS) {
    if (!profile.medals[m.id] && m.test(profile)) {
      profile.medals[m.id] = 1;
      G.medalQueue.push(m);
    }
  }
  saveProfile();
}
function noteRunScore() {
  if (G.score > profile.bestScore) { profile.bestScore = G.score; checkMedals(); }
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------- Input ------------------------------
const keys = {};
const mouse = { x: W * 0.7, y: H * 0.4, lmb: false };
let touchMode = false;
let climbPref = -1;   // which climb direction was asked for most recently
// a finger held down on the canvas is aiming, not throwing (see pointerup)
const touchAim = { active: false, id: -1, moved: false };

function toLogical(cxs, cys) {
  return { x: (cxs - view.ox) / view.scale, y: (cys - view.oy) / view.scale };
}

addEventListener("keydown", e => {
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    // remember which way was asked for most recently, so up-and-down
    // together resolves instead of cancelling to a standstill
    if (e.code === "KeyW" || e.code === "ArrowUp") climbPref = -1;
    if (e.code === "KeyS" || e.code === "ArrowDown") climbPref = 1;
  }
  keys[e.code] = true;
  audioInit();
  if (G.state === "title" && (e.code === "Space" || e.code === "Enter")) startGame();
  if (e.code === "KeyM") toggleMute();
  if ((e.code === "KeyP" || e.code === "Escape") && (G.state === "play" || G.paused)) togglePause();
  if (e.code === "KeyE" || e.code === "ShiftLeft" || e.code === "ShiftRight") throwCoconut();
  if (e.code === "Space") throwBanana();
  if (e.code === "KeyF") swing();
  if (e.code === "KeyQ") throwClam();
  if (G.state === "draft" && /^Digit[123]$/.test(e.code)) takeUpgrade(+e.code.slice(5) - 1);
});
addEventListener("keyup", e => { keys[e.code] = false; });

// A key held down when the page loses focus never receives its keyup, so it
// stays "pressed" forever. Climbing reads up and down together, so one stuck
// direction cancels the other and the monkey can't move at all — which looks
// exactly like being wedged against the sand. Drop every held input whenever
// focus or visibility goes away.
function releaseAllInputs() {
  for (const k of Object.keys(keys)) keys[k] = false;
  mouse.lmb = false;
  touchAim.active = false;
  for (const b of Object.values(touchBtns)) b.held = false;
}
addEventListener("blur", releaseAllInputs);
addEventListener("pagehide", releaseAllInputs);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) releaseAllInputs();
});

cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointermove", e => {
  const p = toLogical(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
  if (G.state === "draft" && G.draft) G.draft.hover = draftCardAt(p.x, p.y);
  if (G.paused) pauseMenu.hover = pauseRowAt(p.x, p.y);
  if (touchAim.active && e.pointerId === touchAim.id) touchAim.moved = true;
});
cv.addEventListener("pointerdown", e => {
  audioInit();
  const p = toLogical(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
  if (e.pointerType === "touch") touchMode = true;
  if (G.state === "title") { startGame(); return; }
  if (G.state === "draft") { draftHit(p.x, p.y); return; }
  if (G.paused) { pauseHit(p.x, p.y); return; }
  if (touchMode && touchButtonHit(p.x, p.y, true)) return;
  if (e.button === 2) { throwCoconut(); return; }
  if (touchMode) {
    // Touch aims by dragging: hold to line the shot up against the arc
    // preview, release to throw. A quick tap still throws where you tapped.
    touchAim.active = true;
    touchAim.id = e.pointerId;
    touchAim.moved = false;
    return;
  }
  mouse.lmb = true;
  throwBanana();
});
addEventListener("pointerup", e => {
  mouse.lmb = false;
  touchBtns.up.held = touchBtns.down.held = false;
  if (touchAim.active && (e.pointerId === touchAim.id || e.pointerId === undefined)) {
    touchAim.active = false;
    if (G.state === "play" && !G.paused) throwBanana();
  }
});
addEventListener("pointercancel", () => { touchAim.active = false; });

// On-screen touch buttons (climb up / down, coconut, stick swing, clam)
const touchBtns = {
  up:    { x: 62,  y: H - 130, r: 40, held: false, label: "▲" },
  down:  { x: 62,  y: H - 46,  r: 40, held: false, label: "▼" },
  coco:  { x: W - 62, y: H - 56, r: 44, held: false },
  swing: { x: W - 160, y: H - 46, r: 38, held: false },
  clam:  { x: W - 62, y: H - 156, r: 34, held: false },
  pause: { x: W - 34, y: 108, r: 22, held: false },   // no keyboard on a phone
};
function touchButtonHit(x, y, press) {
  for (const k of ["up", "down", "coco", "swing", "clam", "pause"]) {
    if (k === "clam" && !G.heldClam) continue;
    const b = touchBtns[k];
    if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r + 8) ** 2) {
      if (k === "pause") { if (press) togglePause(); }
      else if (k === "coco") { if (press) throwCoconut(); }
      else if (k === "swing") { if (press) swing(); }
      else if (k === "clam") { if (press) throwClam(); }
      else b.held = press;
      return true;
    }
  }
  return false;
}

// ----------------------------- Audio -----------------------------
let AC = null, master = null, musicGain = null, musicSrc = null, noiseBuf = null;
let musicFilter = null, bossGain = null, bossSrc = null;
let muted = store.get("mtd_mute") === "1";

function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.55;
  master.connect(AC.destination);
  // shared white-noise buffer
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  startMusic();
}
function toggleMute() {
  muted = !muted;
  store.set("mtd_mute", muted ? "1" : "0");
  if (master) master.gain.value = muted ? 0 : 0.55;
}

// tone: pitch-swept oscillator with quick envelope
function tone(f0, f1, dur, type = "sine", vol = 0.3, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, f0), t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// noise burst through a swept filter
function noiseHit(dur, f0, f1, vol = 0.3, type = "lowpass", delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  s.playbackRate.value = rnd(0.85, 1.2);
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = 1;
  f.frequency.setValueAtTime(f0, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
// short pluck used by jingles
function pluck(freq, vol = 0.25, delay = 0, dur = 0.35) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

const sfx = {
  throwBanana: () => { noiseHit(0.12, 900, 3200, 0.16, "bandpass"); },
  throwCoco:   () => { noiseHit(0.2, 800, 250, 0.22); tone(200, 130, 0.18, "sine", 0.15); },
  splat:       () => { noiseHit(0.14, 1200, 300, 0.22); tone(420, 140, 0.1, "sine", 0.18); },
  empty:       () => { tone(340, 220, 0.05, "square", 0.1); },
  thunk:       () => { tone(110, 55, 0.14, "sine", 0.45); noiseHit(0.05, 2000, 500, 0.12); },
  crack:       () => { noiseHit(0.05, 3000, 900, 0.3, "highpass"); noiseHit(0.09, 1500, 300, 0.28, "lowpass", 0.04); tone(150, 70, 0.15, "sine", 0.3, 0.02); },
  pop:         () => { tone(600, 1300, 0.07, "sine", 0.22); },
  squawk:      () => { tone(rnd(1100, 1400), rnd(450, 600), 0.16, "sawtooth", 0.13); tone(rnd(1400, 1700), 700, 0.1, "square", 0.05, 0.06); },
  crabClick:   () => { tone(1900, 1500, 0.03, "square", 0.12); tone(2100, 1600, 0.03, "square", 0.1, 0.06); },
  hiss:        () => { noiseHit(0.25, 4000, 6000, 0.1, "highpass"); },
  grunt:       () => { tone(180, 90, 0.2, "sawtooth", 0.2); },
  chomp:       () => { noiseHit(0.08, 700, 200, 0.25); tone(160, 90, 0.1, "sine", 0.3, 0.02); },
  creak:       () => { tone(120, 60, 0.9, "sawtooth", 0.18); tone(90, 45, 1.1, "sawtooth", 0.12, 0.15); },
  crash:       () => { noiseHit(0.8, 500, 60, 0.6); tone(80, 35, 0.5, "sine", 0.5); noiseHit(0.3, 1500, 200, 0.3, "lowpass", 0.05); },
  boing:       () => { tone(260, 720, 0.2, "sine", 0.25); },
  chatter:     () => { for (let i = 0; i < 5; i++) tone(i % 2 ? 1250 : 880, i % 2 ? 1100 : 950, 0.07, "triangle", 0.14, i * 0.09); },
  jingleWave:  () => { [523, 659, 784].forEach((f, i) => pluck(f, 0.22, i * 0.09)); },
  jingleHome:  () => { [392, 523, 659, 784, 1046].forEach((f, i) => pluck(f, 0.2, i * 0.1, 0.45)); },
  sadWah:      () => { tone(330, 233, 0.5, "sawtooth", 0.12); tone(311, 208, 0.7, "sawtooth", 0.12, 0.45); },
  heal:        () => { [659, 784, 1046].forEach((f, i) => pluck(f, 0.14, i * 0.06, 0.25)); },
  bonk:        () => { tone(180, 70, 0.1, "square", 0.3); noiseHit(0.06, 1500, 400, 0.2); },
  horn:        () => { [196, 196, 262].forEach((f, i) => tone(f, f * 0.98, 0.3, "sawtooth", 0.2, i * 0.22)); },
  alarm:       () => { tone(700, 1500, 0.18, "square", 0.1); tone(900, 1700, 0.15, "square", 0.08, 0.14); },
  heartbeat:   () => { tone(68, 50, 0.09, "sine", 0.42); tone(62, 46, 0.08, "sine", 0.3, 0.15); },
  horn2:       () => { [147, 147, 196].forEach((f, i) => tone(f, f * 0.97, 0.42, "sawtooth", 0.17, 0.12 + i * 0.24)); },
  fanfare:     () => { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => pluck(f, 0.26, i * 0.11, 0.5)); tone(131, 131, 0.7, "triangle", 0.16, 0.1); },
};

// Cheery 4-bar music loop, pre-rendered into a buffer.
function startMusic() {
  const sr = AC.sampleRate, bpm = 116, step = 60 / bpm / 2; // 8th notes
  const steps = 32, len = Math.floor(steps * step * sr);
  const buf = AC.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  const N = { C4:261.6, D4:293.7, E4:329.6, G4:392, A4:440, C5:523.3, D5:587.3, E5:659.3, G5:784, A5:880, C6:1046.5 };
  const mel = [ N.C5,0,N.E5,N.G5, N.A5,N.G5,N.E5,N.C5,  N.D5,N.E5,N.D5,N.C5, N.A4,N.C5,N.D5,N.E5,
                N.C5,0,N.E5,N.G5, N.A5,N.G5,N.A5,N.C6,  N.G5,N.E5,N.D5,N.C5, N.D5,N.E5,N.C5,0 ];
  const bassBar = [130.8, 110, 87.3, 98]; // C A F G
  const addPluck = (t, f, vol, decay, brite) => {
    const s0 = Math.floor(t * sr), n = Math.min(len - s0, Math.floor(0.5 * sr));
    for (let i = 0; i < n; i++) {
      const tt = i / sr, e = Math.exp(-tt * decay);
      data[s0 + i] += vol * e * (Math.sin(TAU * f * tt) + brite * Math.sin(TAU * f * 2 * tt) * Math.exp(-tt * 9));
    }
  };
  for (let s = 0; s < steps; s++) {
    const t = s * step;
    if (mel[s]) addPluck(t, mel[s], 0.16, 7, 0.35);
    if (s % 8 === 0 || s % 8 === 4) addPluck(t, bassBar[(s / 8) | 0], 0.2, 5, 0.15);
    if (s % 2 === 1) { // soft shaker
      const s0 = Math.floor(t * sr), n = Math.floor(0.05 * sr);
      for (let i = 0; i < n; i++) data[s0 + i] += (Math.random() * 2 - 1) * 0.03 * Math.exp(-i / sr * 60);
    }
  }
  const src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  src.playbackRate.value = G.musicRate;
  musicGain = AC.createGain(); musicGain.gain.value = 0.5;
  // Night waves duck the melody behind a lowpass so the beach feels quieter.
  musicFilter = AC.createBiquadFilter();
  musicFilter.type = "lowpass";
  musicFilter.frequency.value = 20000;
  src.connect(musicGain); musicGain.connect(musicFilter); musicFilter.connect(master);
  src.start();
  musicSrc = src;
  startBossLayer(sr, step, steps, len);
}
// A second loop, the same length so it stays phase-locked with the melody,
// silent until King Pincher turns up. Layering beats swapping buffers — the
// tune never restarts, it just grows a threat underneath it.
function startBossLayer(sr, step, steps, len) {
  const buf = AC.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  // low minor ostinato: C, Eb, G, Eb — plus a slow floor-tom pulse
  const notes = [65.4, 77.8, 98, 77.8];
  const growl = (t, f, vol, decay) => {
    const s0 = Math.floor(t * sr), n = Math.min(len - s0, Math.floor(0.9 * sr));
    for (let i = 0; i < n; i++) {
      const tt = i / sr, e = Math.exp(-tt * decay);
      // slightly detuned pair gives it a menacing beat frequency
      data[s0 + i] += vol * e * (Math.sin(TAU * f * tt) + 0.7 * Math.sin(TAU * f * 1.006 * tt)
                                 + 0.25 * Math.sin(TAU * f * 0.5 * tt));
    }
  };
  const thud = t => {
    const s0 = Math.floor(t * sr), n = Math.min(len - s0, Math.floor(0.25 * sr));
    for (let i = 0; i < n; i++) {
      const tt = i / sr, e = Math.exp(-tt * 16);
      data[s0 + i] += 0.32 * e * Math.sin(TAU * (110 - 70 * tt / 0.25) * tt);
    }
  };
  for (let s = 0; s < steps; s++) {
    const t = s * step;
    if (s % 4 === 0) growl(t, notes[((s / 4) | 0) % notes.length], 0.13, 3.2);
    if (s % 8 === 0 || s % 8 === 6) thud(t);
  }
  const src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  src.playbackRate.value = G.musicRate;
  bossGain = AC.createGain(); bossGain.gain.value = 0;
  src.connect(bossGain); bossGain.connect(master);
  src.start();
  bossSrc = src;
}
// Fades the King's layer in and out, and opens or closes the night filter.
function updateMusicLayers(dt) {
  if (!AC) return;
  const t = AC.currentTime;
  // Schedule a ramp only when the TARGET changes. Re-ramping every frame
  // restarts the ramp from wherever it got to, so the value creeps toward
  // the target and never arrives.
  const wantBoss = G.state === "play" && G.enemies.some(e => e.kind === "boss" && !e.dead) ? 0.85 : 0;
  if (bossGain && bossGain._target !== wantBoss) {
    bossGain._target = wantBoss;
    bossGain.gain.cancelScheduledValues(t);
    bossGain.gain.setValueAtTime(bossGain.gain.value, t);
    bossGain.gain.linearRampToValueAtTime(wantBoss, t + 1.2);
  }
  // G.night is already eased frame to frame, so the filter can track it
  // directly rather than chasing it with ramps.
  if (musicFilter) musicFilter.frequency.value = 20000 - G.night * 18200;
  // crickets, but only once it is properly dark
  if (G.night > 0.65 && G.state === "play") {
    G.cricketT -= dt;
    if (G.cricketT <= 0) {
      G.cricketT = rnd(0.5, 1.6);
      const f = rnd(2300, 3100);
      for (let i = 0; i < 3; i++) tone(f, f * 0.97, 0.035, "triangle", 0.035, i * 0.055);
    }
  }
}
// The soundtrack keeps pace with the waves — faster music, higher tension.
function setMusicRate(r) {
  G.musicRate = r;
  const t = AC ? AC.currentTime : 0;
  for (const src of [musicSrc, bossSrc]) {
    if (!src) continue;
    src.playbackRate.cancelScheduledValues(t);
    src.playbackRate.setValueAtTime(src.playbackRate.value, t);
    src.playbackRate.linearRampToValueAtTime(r, t + 1.5);
  }
}

function shouldDraft(wave) { return wave % 3 === 0 || wave % 5 === 0; }
function openDraft() {
  const pool = UPGRADES.filter(b => lv(b.id) < b.max);
  if (!pool.length) { startWave(G.wave + 1); return; }
  const picks = [];
  const bag = pool.slice();
  while (picks.length < 3 && bag.length) picks.push(...bag.splice(Math.floor(rnd(bag.length)), 1));
  G.draft = { picks, t: 0, hover: -1 };
  G.state = "draft";
  G.banner = { text: "", sub: "", t: 0, dur: 0 };  // don't read through the overlay
  sfx.jingleWave();
}
function takeUpgrade(i) {
  if (G.state !== "draft" || !G.draft) return;
  const b = G.draft.picks[i];
  if (!b) return;
  G.upgrades[b.id] = lv(b.id) + 1;
  if (b.id === "bark") {
    G.tree.max += 25;
    G.tree.hp = G.tree.max;
    G.tree.stage = 0;
  }
  if (b.id === "bunch") G.bananas = bananaMax();
  G.draft = null;
  G.state = "play";
  addFloat(TREE_X + 24, 300, b.name + " " + ROMAN[lv(b.id)] + "!", b.tint);
  sfx.jingleHome();

// --------------------------- Game flow ---------------------------
function startGame() {

  G.medalQueue.length = 0; G.medal = null;

// From wave 8 a wave can carry a modifier that changes how you play it,
// not just how much of it there is.
const MODIFIERS = [
  { id: "windy", name: "WINDY!",  sub: "the sea breeze bends every throw" },
  { id: "night", name: "NIGHTFALL", sub: "harder to see them coming" },
  { id: "swarm", name: "SWARM!",  sub: "a lot of them, all at once" },

function setWave(n) {

  G.bannedKind = null;
  G.squadQueue = [];

  G.modifier = (n >= 8 && !G.bossWave && Math.random() < 0.45) ? pick(MODIFIERS) : null;
  G.wind = G.modifier && G.modifier.id === "windy" ? pick([-1, 1]) * rnd(150, 260) : 0;
  if (G.bossWave) {
    G.toSpawn = 4 + Math.floor(G.wave / 10);   // light escort — the King is the show
    G.interval = Math.max(1.8, 3.2 - G.wave * 0.05);
  } else {
    G.toSpawn = Math.min(60, 4 + n * 2 + Math.floor(n * n * 0.1));
    G.interval = Math.max(0.32, Math.min(1.7, 2.1 - n * 0.11));
    if (G.modifier && G.modifier.id === "swarm") {
      G.toSpawn = Math.min(60, Math.round(G.toSpawn * 1.6));
      G.interval *= 0.55;
    }
  }
  G.spawnT = 1.4;
  G.waveLull = 0;
  setMusicRate(1 + Math.min(0.5, (n - 1) * 0.045));
}
function startWave(n) {
  setWave(n);

  // 5), so the milestone flourish layers on top of whatever the wave already
  // is rather than replacing it — a milestone King should feel bigger, not
  // quieter.
  const milestone = n % 10 === 0;
  if (G.bossWave) {
    const kings = bossCount();
    // A real entrance: the beach dims, the horn sounds twice, and the sand
    // jumps as he comes up out of the surf.
    G.kingEntrance = 2.6;
    banner(kings > 1 ? kings + " KINGS APPROACH!" : "KING PINCHER", "Wave " + n, 2.6);
    sfx.horn();
    sfx.horn2();
    shake(9);
    for (let i = 0; i < 10; i++)
      G.parts.push({ kind: "dust", x: W - 90 - i * 22, y: GROUND - rnd(0, 14), vx: 0, vy: 0,
        g: 0, life: rnd(0.7, 1.3), t: 0, rot: 0, color: "#F0D9A0" });
    for (let i = 0; i < kings; i++) spawnBoss(i);
  } else {
    if (G.modifier) { banner("WAVE " + n + " — " + G.modifier.name, G.modifier.sub, 2.6); sfx.alarm(); }
    else if (n % 10 === 0) banner("WAVE " + n + "!", "the beach will remember this", 3);
    else banner("WAVE " + n, n === 1 ? "Protect your tree!" : "They're getting faster!");
    if (n % 10 !== 0) sfx.jingleWave();

}
function togglePause() {

  pauseMenu.page = "menu";

// --------------------------- Enemies -----------------------------
const KINDS = {
  // difficulty escalates through composition (new kinds, squads, dives, the
  // King) rather than raw speed — the ramps here are deliberately gentle
  bird:  { hp: 1,  r: 20, score: 10,  dmg: 3,  atkCd: 0.9, speed: () => Math.min(205, 68 + (G.wave - 1) * 5) },
  crab:  { hp: 2,  r: 18, score: 15,  dmg: 4,  atkCd: 1.1, speed: () => Math.min(168, 52 + (G.wave - 1) * 4) },
  snake: { hp: 1,  r: 17, score: 20,  dmg: 4,  atkCd: 0.8, speed: () => Math.min(255, 105 + (G.wave - 1) * 5) },
  boar:  { hp: 6,  r: 26, score: 50,  dmg: 9,  atkCd: 1.4, speed: () => Math.min(180, 62 + (G.wave - 1) * 3.5) },
  // armored: bananas just clank off, so it forces a coconut or the stick
  hermit:{ hp: 4,  r: 21, score: 40,  dmg: 6,  atkCd: 1.3, speed: () => Math.min(158, 48 + (G.wave - 1) * 3), armored: true },
  // thief: ignores the tree entirely and robs the banana stash
  gull:  { hp: 1,  r: 19, score: 35,  dmg: 0,  atkCd: 1.0, speed: () => Math.min(290, 150 + (G.wave - 1) * 4), thief: true },
  boss:  { hp: 25, r: 44, score: 250, dmg: 15, atkCd: 1.4, speed: () => 40 },
};
// Past the midgame everything on the beach grows a little tougher. Without
// this the caps below mean a stocked-up player simply outgrows the waves.
function waveHpBonus() { return Math.floor(Math.max(0, G.wave - 12) / 8); }
// King Pincher is a rematch, not a set piece — each one is bigger than the
// last, and eventually he brings company.
function bossHp() { return 25 + Math.max(0, Math.floor(G.wave / 5) - 1) * 12; }
function bossCount() { return 1 + Math.floor(Math.max(0, G.wave - 15) / 20); }
function pickKind() {
  const w = G.wave;
  const bag = [["bird", 10]];
  if (w >= 2) bag.push(["crab", 8]);
  if (w >= 4) bag.push(["snake", 5]);
  if (w >= 6) bag.push(["boar", 3]);
  if (w >= 8) bag.push(["hermit", 4]);
  if (w >= 9) bag.push(["gull", 4]);
  const allowed = bag.filter(b => b[0] !== G.bannedKind);
  if (!allowed.length) return null;
  let total = allowed.reduce((s, b) => s + b[1], 0), roll = rnd(total);
  for (const [k, wt] of allowed) { roll -= wt; if (roll <= 0) return k; }
  return allowed[0][0];
}
function spawnEnemy(kind) {
  kind = kind || pickKind();
  if (!kind || kind === G.bannedKind) return;
  // the tide takes an unclaimed clam once the next attackers arrive
  if (G.clam) { G.clam = null; addFloat(TREE_X + 46, GROUND - 34, "the clam washed away…", "#D8F7FF"); }
  const w = G.wave;
  let side = 1; // 1 = from right
  const flier = kind === "bird" || kind === "gull";
  if (flier && w >= 3 && Math.random() < 0.22) side = -1;
  if (!flier && w >= 6 && Math.random() < 0.15) side = -1;

  const k = KINDS[kind];
  const hp = k.hp + waveHpBonus();
  const e = {
    kind, side, hp, maxhp: hp, r: k.r,
    x: side === 1 ? W + 60 : -60,
    y: (kind === "bird" || kind === "gull") ? rnd(120, 330) : GROUND - 10,
    vx: -side * k.speed(),
    state: "move", t: rnd(10), atk: 0, flash: 0, flee: false,
    bob: rnd(TAU),
  };
  if (kind === "boar") e.y = GROUND - 14;
  if (k.thief) { e.thief = true; e.loot = 0; }
  if (k.armored) e.armored = true;
  G.enemies.push(e);
  if (e.armored) tip("hermit", "Hermit crab! Its shell bounces bananas — use a coconut or the stick.", "#C99A5B");
  if (e.thief) tip("gull", "Gull! It's after your bananas, not the tree — knock it down to get them back.", "#F2F6F9");
}
function spawnBoss(index = 0) {
  const k = KINDS.boss;
  const hp = bossHp();
  G.enemies.push({
    kind: "boss", side: 1, hp, maxhp: hp, r: k.r,
    x: W + 90 + index * 120, y: GROUND - 24, vx: -k.speed(),
    state: "move", t: index * 0.7, atk: 0, flash: 0, flee: false, bob: 0,
  });
}
// A gull that reaches the monkey takes bananas out of the stash and flees.
// Shoot it down before it escapes and the bananas fall back to you.
function robStash(e) {
  const take = Math.min(G.bananas, 3);
  e.flee = true;
  e.loot = take;
  if (take > 0) {
    G.bananas -= take;
    G.bananaRegrow = bananaRate();
    addFloat(e.x, e.y - 24, "-" + take + " 🍌", "#FF8A5C");
    G.bananaFlash = 0.5;
    shake(4);
  } else {
    addFloat(e.x, e.y - 24, "nothing to steal!", "#D8F7FF");
  }
  sfx.squawk();
}
function killEnemy(e, bonusLabel) {
  const k = KINDS[e.kind];
  if (e.thief && e.loot > 0) {
    G.bananas = Math.min(bananaMax(), G.bananas + e.loot);
    addFloat(e.x, e.y - 40, "+" + e.loot + " 🍌 back!", "#8CFF6B");
    e.loot = 0;
  }
  if (G.comboT > 0) G.combo++; else G.combo = 1;
  G.comboT = 2;
  const pts = k.score * G.combo;
  G.score += pts;
  G.treeStats.kills++;
  G.treeStats.bestCombo = Math.max(G.treeStats.bestCombo, G.combo);
  profile.kills++;
  if (e.kind === "boss") profile.kings++;
  if (G.score > G.hi) { G.hi = G.score; store.set("mtd_hi", G.hi); }
  noteRunScore();
  addFloat(e.x, e.y - 24, "+" + pts + (G.combo > 1 ? "  x" + G.combo : ""), G.combo > 1 ? "#FFD23B" : "#FFFFFF");
  if (bonusLabel) addFloat(e.x, e.y - 44, bonusLabel, "#8CFF6B");

    // the King falls: confetti, fanfare, and the tree breathes again
    for (let i = 0; i < 22; i++) burst(e.x + rnd(-30, 30), e.y + rnd(-30, 10), pick(["#FFD23B", "#FF8A5C", "#8CFF6B", "#7FE3FF", "#FF9CCB"]), 2);
    G.tree.hp = Math.min(G.tree.max, G.tree.hp + 30);
    const frac = G.tree.hp / G.tree.max;
    G.tree.stage = frac > 0.66 ? 0 : frac > 0.33 ? 1 : 2;

// Each species goes out as the thing it was made of: feathers, shell shards,

const PART = (kind, x, y, o = {}) => G.parts.push(Object.assign({

        addFloat(s.x, GROUND - 30, "the clam shattered…", "#FFC9DE");
        sfx.crack();
        s.dead = true;
      } else if (!s.bounced && Math.abs(s.vy) > 260) {
        s.bounced = true; s.y = GROUND - 4; s.vy *= -0.45; s.vx *= 0.75;
        sfx.thunk();
        G.parts.push({ kind: "dust", x: s.x, y: GROUND - 4, vx: rnd(-30, 30), vy: rnd(-60, -20), g: 120, life: 0.5, t: 0, rot: 0, color: "#F0D9A0" });
      } else explodeCoco(s);
    }
    if (s.x < -80 || s.x > W + 80 || s.y > H + 60) s.dead = true;
  }
  G.shots = G.shots.filter(s => !s.dead);
}

// ------------------------- FX helpers ----------------------------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), sp = rnd(40, 200);
    G.parts.push({ kind: Math.random() < 0.4 ? "star" : "circle", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, g: 420, life: rnd(0.35, 0.75), t: 0, rot: rnd(TAU), color });
  }
}
function addFloat(x, y, text, color) {
  G.floats.push({ x, y, text, color, t: 0, life: 1.1 });
}
// One-time coaching. Each rule the game added later (shells, thieves, the
// pinch) is otherwise only learnable by guessing, so the first time one
// bites, say so once. Fires at most once per run and never stacks.
function tip(id, text, tint = "#FFE9A8") {
  if (G.tipsSeen[id]) return;
  G.tipsSeen[id] = true;
  G.tip = { text, tint, t: 0, dur: 4.6 };
  sfx.chatter();
}
function updateFX(dt) {
  for (const p of G.parts) {
    p.t += dt;
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += dt * 4;
    if (p.kind === "leaf" || p.kind === "feather") p.x += Math.sin(p.t * 5 + p.rot) * 30 * dt;
    if (p.y > GROUND + 40) p.t = p.life;
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.floats) { f.t += dt; f.y -= 42 * dt; }
  G.floats = G.floats.filter(f => f.t < f.life);
  G.shakeAmp = Math.max(0, G.shakeAmp - dt * 26);
}

// --------------------------- Update ------------------------------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!G.paused && !G.frozen) update(dt);
  render();
}
function update(dt) {
  G.t += dt;
  const m = G.monkey;
  m.blink -= dt;
  if (m.blink < -3) m.blink = rnd(0.1, 0.18);
  m.throwT = Math.max(0, m.throwT - dt);
  m.swingT = Math.max(0, m.swingT - dt);
  m.swingCd = Math.max(0, m.swingCd - dt);
  m.stunT = Math.max(0, m.stunT - dt);
  m.safeT = Math.max(0, m.safeT - dt);
  G.bananaCd = Math.max(0, G.bananaCd - dt);
  G.cocoCd = Math.max(0, G.cocoCd - dt);
  G.bananaFlash = Math.max(0, G.bananaFlash - dt);
  // the bunch regrows one banana at a time
  if (G.bananas < bananaMax()) {
    G.bananaRegrow -= dt;
    if (G.bananaRegrow <= 0) { G.bananas++; G.bananaRegrow = bananaRate(); }
  } else G.bananaRegrow = bananaRate();
  G.kingEntrance = Math.max(0, G.kingEntrance - dt);
  G.confetti = Math.max(0, G.confetti - dt);
  if (G.medal) { G.medal.t += dt; if (G.medal.t > G.medal.dur) G.medal = null; }
  if (!G.medal && G.medalQueue.length) { G.medal = { m: G.medalQueue.shift(), t: 0, dur: 3.6 }; sfx.jingleHome(); }
  if (G.tip) { G.tip.t += dt; if (G.tip.t > G.tip.dur) G.tip = null; }
  updateMusicLayers(dt);
  if (G.state === "play") G.treeStats.t += dt;
  const wantNight = G.state === "play" && G.modifier && G.modifier.id === "night" ? 1 : 0;
  G.night += clamp(wantNight - G.night, -dt * 0.8, dt * 0.8);
  G.comboT = Math.max(0, G.comboT - dt);
  if (G.comboT === 0) G.combo = 0;
  G.banner.t += dt;
  G.tree.hitT = Math.max(0, G.tree.hitT - dt);
  G.tree.sway = Math.sin(G.t * 0.9) * 0.02 + (G.tree.hitT > 0 ? Math.sin(G.t * 40) * 0.02 * G.tree.hitT : 0);
  for (const c of clouds) { c.x -= c.v * dt * (G.state === "running" ? 4 : 1); if (c.x < -160) { c.x = W + 160; c.y = rnd(30, 170); } }

  if (G.state === "title") {
    m.mode = "tree"; m.x = TREE_X + 24;
    m.y = 380 + Math.sin(G.t * 1.4) * 6;
    m.cycle += dt * 2;
    return;
  }
  if (G.state === "play") {
    G.playT += dt;
    // climbing (not while seeing stars)
    const wantUp = keys.KeyW || keys.ArrowUp || touchBtns.up.held;
    const wantDown = keys.KeyS || keys.ArrowDown || touchBtns.down.held;
    // both at once means the most recent request wins rather than the two
    // cancelling out — a stuck input can slow you down but never trap you
    let dy = wantUp && wantDown ? climbPref : wantUp ? -1 : wantDown ? 1 : 0;
    if (dy !== 0 && m.stunT <= 0) {
      m.y = clamp(m.y + dy * 240 * dt, CLIMB_MIN, CLIMB_MAX);
      m.cycle += dt * 10;
      if (Math.random() < dt * 2.5) dropLeaf();
    }
    if (mouse.lmb) throwBanana();
    // clam pickup: climb all the way down and grab it
    if (G.clam && m.stunT <= 0 && m.y > CLIMB_MAX - 40) {
      G.clam = null;
      G.heldClam = true;
      sfx.chatter();
      addFloat(TREE_X + 40, GROUND - 44, "CLAM! (Q to throw)", "#FF9CCB");
    }
    // spawning: singles, and from wave 4 the occasional squad of three
    if (G.toSpawn > 0) {
      G.spawnT -= dt;
      if (G.spawnT <= 0) {
        G.spawnT = G.interval * rnd(0.7, 1.3);
        const kind = pickKind();
        if (!kind) {
          G.toSpawn = 0; // everything spawnnable is banished — wave collapses
        } else if (G.wave >= 4 && !G.bossWave && G.toSpawn >= 3 && Math.random() < 0.25) {
          G.toSpawn -= 3;
          G.squadQueue.push({ kind, delay: 0 }, { kind, delay: 0.35 }, { kind, delay: 0.7 });
        } else {
          G.toSpawn--;
          spawnEnemy(kind);
        }
      }
    } else if (G.enemies.length === 0 && G.squadQueue.length === 0) {
      if (G.waveLull <= 0) {
        G.waveLull = 3;
        profile.waves++;
        profile.bestWave = Math.max(profile.bestWave, G.wave);
        checkMedals();
        banner("WAVE " + G.wave + " CLEAR!", "+15 tree HP", 2);
        G.tree.hp = Math.min(G.tree.max, G.tree.hp + 15);
        const frac = G.tree.hp / G.tree.max;
        G.tree.stage = frac > 0.66 ? 0 : frac > 0.33 ? 1 : 2;
        G.bananas = bananaMax(); G.bananaRegrow = bananaRate();
        sfx.heal();
        // sometimes the tide leaves a gift at the trunk base…
        if (!G.heldClam && Math.random() < clamChance()) {
          G.clam = { t: 0 };
          tip("clam", "A clam washed up! Climb to the bottom to grab it before the next wave.", "#FF9CCB");
        }
      }
      G.waveLull -= dt;
      if (G.waveLull <= 0) {
        G.waveLull = 0;
        if (shouldDraft(G.wave)) openDraft();
        else startWave(G.wave + 1);
      }
    }
    for (const q of G.squadQueue) { q.delay -= dt; if (q.delay <= 0) spawnEnemy(q.kind); }
    G.squadQueue = G.squadQueue.filter(q => q.delay > 0);
    // low tree HP: the heartbeat of a worried monkey
    if (G.tree.hp / G.tree.max < 0.25) {
      G.heartT -= dt;
      if (G.heartT <= 0) {
        G.heartT = lerp(0.5, 0.95, G.tree.hp / (G.tree.max * 0.25));
        sfx.heartbeat();
      }
    }
    for (const e of G.enemies) updateEnemy(e, dt);
    G.enemies = G.enemies.filter(e => !e.dead);
    updateShots(dt);
  } else if (G.state === "falling") {
    updateFalling(dt);
    // monkey ballistic jump-off
    if (m.mode === "jump") {
      m.vy += 900 * dt;
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y >= GROUND - 26) { m.y = GROUND - 26; m.mode = "ground"; G.parts.push({ kind: "dust", x: m.x, y: GROUND - 4, vx: 0, vy: -30, g: 60, life: 0.5, t: 0, rot: 0, color: "#F0D9A0" }); }
    }
    for (const e of G.enemies) updateEnemy(e, dt);
    G.enemies = G.enemies.filter(e => !e.dead);
    updateShots(dt);
  } else if (G.state === "running") {
    updateRunning(dt);
  } else if (G.state === "arrive") {
    updateArrive(dt);
  }
  updateFX(dt);
}

// ============================ RENDER ==============================
function render() {
  const s = view.scale * view.dpr;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#083a52";
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.setTransform(s, 0, 0, s, view.ox * view.dpr, view.oy * view.dpr);
  cx.save();
  cx.beginPath(); cx.rect(0, 0, W, H); cx.clip();

  // camera shake
  if (G.shakeAmp > 0.2) cx.translate(rnd(-G.shakeAmp, G.shakeAmp), rnd(-G.shakeAmp, G.shakeAmp));

  drawSky();
  drawSea();
  drawGround();
  if (G.clam) drawClamPickup();

  // fallen tree scrolling away
  if (G.fallenTree) drawTree(G.fallenTree.x, G.fallenTree.angle, G.fallenTree.stage, G.fallenTree.seed);

  // home / incoming tree
  if (G.state === "running") drawTree(G.newTreeX, 0, 0, 7 + (G.treesLost + 1) * 13);
  else if (G.state === "falling") drawTree(TREE_X, G.tree.fallAngle, G.tree.stage, G.tree.seed);
  else drawTree(TREE_X, 0, G.tree.stage, G.tree.seed);

  for (const e of G.enemies) drawEnemy(e);
  drawMonkey();
  for (const sh of G.shots) drawShot(sh);
  drawParticles();
  drawKingEntrance();
  drawConfetti();
  drawNight();      // dusk tint sits over the world but under the aiming aids
  drawWind();
  drawTrajectory(); // an aiming aid, so it stays readable above the tint
  drawFloats();
  drawHUD();

  if (G.state === "title") drawTitle();
  if (G.state === "draft") drawDraft();
  drawSummary();
  if (G.paused) drawPaused();

  cx.restore();
}

// ------------------------ Background art --------------------------
function drawSky() {
  const g = cx.createLinearGradient(0, 0, 0, HORIZON + 30);
  g.addColorStop(0, "#63D4FF");
  g.addColorStop(0.65, "#9FE8FF");
  g.addColorStop(1, "#FFF3C4");
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, HORIZON + 30);

  // smiling sun — turns in for the night on NIGHTFALL waves
  const sx = 830, sy = 84;
  cx.save();
  cx.globalAlpha = 1 - G.night;
  cx.save();
  cx.translate(sx, sy);
  cx.rotate(G.t * 0.15);
  cx.fillStyle = "#FFD93B";
  for (let i = 0; i < 12; i++) {
    cx.rotate(TAU / 12);
    cx.beginPath();
    cx.moveTo(46, -7); cx.lineTo(66 + Math.sin(G.t * 2 + i) * 4, 0); cx.lineTo(46, 7);
    cx.closePath(); cx.fill();
  }
  cx.restore();
  cx.fillStyle = "#FFE14D";
  cx.beginPath(); cx.arc(sx, sy, 42, 0, TAU); cx.fill();
  cx.fillStyle = "#F7A825";
  cx.beginPath(); cx.arc(sx - 13, sy - 5, 4.5, 0, TAU); cx.arc(sx + 13, sy - 5, 4.5, 0, TAU); cx.fill();
  cx.strokeStyle = "#F7A825"; cx.lineWidth = 3.5; cx.lineCap = "round";
  cx.beginPath(); cx.arc(sx, sy + 6, 14, 0.15 * Math.PI, 0.85 * Math.PI); cx.stroke();
  cx.restore();
  // a sleepy moon takes its place
  if (G.night > 0.01) {
    cx.save();
    cx.globalAlpha = G.night;
    cx.fillStyle = "#F3F1DC";
    cx.beginPath(); cx.arc(sx, sy, 34, 0, TAU); cx.fill();
    cx.fillStyle = "#DAD7BE";
    cx.beginPath(); cx.arc(sx - 11, sy - 9, 6, 0, TAU); cx.arc(sx + 9, sy + 6, 8, 0, TAU);
    cx.arc(sx + 4, sy - 14, 4.5, 0, TAU); cx.fill();
    cx.restore();
  }

  // clouds
  for (const c of clouds) {
    cx.save();
    cx.translate(c.x, c.y); cx.scale(c.s, c.s);
    cx.fillStyle = "rgba(255,255,255,0.92)";
    cx.beginPath();
    cx.arc(-30, 6, 20, 0, TAU); cx.arc(0, -4, 26, 0, TAU); cx.arc(30, 6, 20, 0, TAU);
    cx.rect(-40, 6, 80, 18);
    cx.fill();
    cx.restore();
  }
}
function drawSea() {
  cx.fillStyle = "#37BEE8";
  cx.fillRect(0, HORIZON, W, GROUND - HORIZON + 6);
  cx.fillStyle = "#7FE3FF";
  cx.fillRect(0, HORIZON, W, 4);
  // little distant island
  const isx = 700 - (G.scrollTotal * 0.15) % (W + 400);
  cx.fillStyle = "#3DAF6B";
  cx.beginPath(); cx.arc(isx, HORIZON + 4, 26, Math.PI, 0); cx.fill();
  cx.fillStyle = "#8A5228";
  cx.fillRect(isx - 2, HORIZON - 18, 4, 20);
  cx.fillStyle = "#4CC96B";
  cx.beginPath(); cx.arc(isx, HORIZON - 18, 12, 0, TAU); cx.fill();
  // animated wave dashes
  cx.strokeStyle = "rgba(255,255,255,0.55)"; cx.lineWidth = 3; cx.lineCap = "round";
  for (let row = 0; row < 3; row++) {
    const y = HORIZON + 16 + row * 16;
    const off = (G.t * (18 + row * 9) + G.scrollTotal * 0.4) % 90;
    cx.beginPath();
    for (let x = -off; x < W; x += 90) {
      cx.moveTo(x + 10, y + Math.sin((x + G.t * 40) * 0.02) * 2);
      cx.lineTo(x + 38, y + Math.sin((x + G.t * 40) * 0.02) * 2);
    }

  }
}
function drawGround() {
  // sand with a wavy top edge
  cx.fillStyle = "#FFE49E";
  cx.beginPath();
  cx.moveTo(0, GROUND + 8);
  for (let x = 0; x <= W; x += 60) cx.quadraticCurveTo(x + 30, GROUND - 6, x + 60, GROUND + 6);
  cx.lineTo(W, H); cx.lineTo(0, H);
  cx.closePath(); cx.fill();
  cx.fillStyle = "#FFF0C2";
  cx.fillRect(0, GROUND + 2, W, 5);
  // speckles
  cx.fillStyle = "rgba(216,166,88,0.5)";
  for (const sp of speckles) {
    const dx = wrapX(sp.x);
    if (dx > -20 && dx < W + 20) { cx.beginPath(); cx.arc(dx, sp.y, sp.s, 0, TAU); cx.fill(); }
  }
  // scrolling props
  for (const d of decor) {
    const dx = wrapX(d.x);
    if (dx < -60 || dx > W + 60) continue;
    drawProp(d, dx);
  }
}
function wrapX(x) {
  const sc = (G.state === "running" || G.state === "arrive") ? G.scroll : 0;
  return ((x - sc) % DECOR_WRAP + DECOR_WRAP) % DECOR_WRAP - 200;
}
function drawProp(d, x) {
  cx.save();
  cx.translate(x, GROUND + 14);
  cx.scale(d.s, d.s);

    cx.fillStyle = d.hue;
    for (let i = 0; i < 5; i++) {

      cx.beginPath(); cx.arc(Math.cos(a) * 7, -14 + Math.sin(a) * 7, 5.5, 0, TAU); cx.fill();
    }
    cx.fillStyle = "#FFE14D";
    cx.beginPath(); cx.arc(0, -14, 4.5, 0, TAU); cx.fill();
  } else if (d.kind === "bush") {

  } else if (d.kind === "starfish") {

// ----------------------------- Tree -------------------------------
function drawTree(baseX, angle, stage, seed) {
  const r = mulberry32(seed);
  cx.save();
  cx.translate(baseX, GROUND + 4);
  cx.rotate(angle);

  const trunkH = GROUND + 4 - TRUNK_TOP;
  // curved tapering trunk
  cx.fillStyle = "#B5713A";
  cx.beginPath();
  cx.moveTo(-16, 0);
  cx.bezierCurveTo(-14, -trunkH * 0.45, -4 + 10, -trunkH * 0.8, 4, -trunkH);
  cx.lineTo(20, -trunkH + 4);
  cx.bezierCurveTo(14, -trunkH * 0.7, 18, -trunkH * 0.4, 18, 0);
  cx.closePath(); cx.fill();
  cx.strokeStyle = "#8A5228"; cx.lineWidth = 3;
  cx.stroke();
  // trunk ring lines
  cx.strokeStyle = "rgba(138,82,40,0.7)"; cx.lineWidth = 2.5; cx.lineCap = "round";
  for (let i = 1; i <= 5; i++) {
    const yy = -trunkH * i / 6, wob = Math.sin(i * 2.4) * 4;
    cx.beginPath(); cx.moveTo(-13 + i * 1.2 + wob, yy); cx.quadraticCurveTo(2, yy + 5, 16 - i * 0.8 + wob, yy); cx.stroke();
  }
  if (stage >= 1) { // scratches when damaged
    cx.strokeStyle = "#6B3E1D"; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(-8, -30); cx.lineTo(4, -52); cx.moveTo(10, -80); cx.lineTo(-2, -104); cx.stroke();
  }

  // canopy (sways)
  cx.save();
  cx.translate(10, -trunkH);
  cx.rotate(G.state === "play" || G.state === "title" ? G.tree.sway : 0);
  const fronds = stage === 0 ? 7 : stage === 1 ? 5 : 3;
  const droop = stage * 0.22;
  const cols = stage === 0 ? ["#3DAF35", "#59C93C", "#7FE05B"] : stage === 1 ? ["#7FB53A", "#9CC94A", "#B8D45C"] : ["#B59A3A", "#C9A94A", "#D4B85C"];
  for (let i = 0; i < fronds; i++) {
    const a = Math.PI + (i + 0.5) / fronds * Math.PI + droop * (i % 2 ? 1 : -1) * 0.4;
    const len = 78 + r() * 22;
    cx.save();
    cx.rotate(a + droop * 0.6);
    cx.fillStyle = cols[i % 3];
    cx.beginPath();
    cx.moveTo(0, 0);
    cx.quadraticCurveTo(len * 0.5, -26 - droop * 30, len, -6 + droop * 26);
    cx.quadraticCurveTo(len * 0.5, 8, 0, 0);
    cx.closePath(); cx.fill();
    cx.strokeStyle = "rgba(40,110,35,0.5)"; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(4, -1); cx.quadraticCurveTo(len * 0.5, -12 - droop * 15, len * 0.94, -5 + droop * 24); cx.stroke();
    cx.restore();
  }
  // coconuts & banana bunch at crown
  cx.fillStyle = "#6B3E1D";
  cx.beginPath(); cx.arc(-10, 6, 9, 0, TAU); cx.arc(8, 8, 9, 0, TAU); cx.arc(-1, 14, 9, 0, TAU); cx.fill();
  if (stage < 2) {
    cx.save();
    cx.translate(24, 14);
    for (let i = 0; i < 4; i++) {
      cx.fillStyle = "#FFD23B";
      cx.beginPath();
      cx.ellipse(i * 5 - 6, i % 2 * 4, 4, 10, 0.4 + i * 0.15, 0, TAU);
      cx.fill();
    }
    cx.restore();
  }
  cx.restore();
  cx.restore();
}

// ---------------------------- Monkey -------------------------------
function drawMonkey() {
  const m = G.monkey;
  const fur = "#A9683B", furD = "#7E4A26", skin = "#EFC894";
  cx.save();
  cx.translate(m.x, m.y);
  const running = m.mode !== "tree";   // airborne/running poses share the free-limb art
  const f = m.face;
  cx.scale(f, 1);

  const bob = running ? Math.abs(Math.sin(m.cycle)) * -5 : Math.sin(G.t * 2) * 1.5;
  cx.translate(0, bob);

  // tail
  cx.strokeStyle = fur; cx.lineWidth = 7; cx.lineCap = "round";
  const tw = Math.sin(G.t * 3 + 1) * 8;
  cx.beginPath();
  cx.moveTo(-14, 6);
  cx.bezierCurveTo(-34, 8, -40, -12 + tw, -28, -22 + tw * 0.5);
  cx.stroke();

  if (running) {
    // legs run cycle
    const c = m.cycle;
    cx.strokeStyle = furD; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(-4, 16); cx.lineTo(-4 + Math.sin(c) * 14, 30); cx.stroke();
    cx.beginPath(); cx.moveTo(4, 16); cx.lineTo(4 + Math.sin(c + Math.PI) * 14, 30); cx.stroke();
    cx.strokeStyle = fur;
    cx.beginPath(); cx.moveTo(-2, -4); cx.lineTo(-2 + Math.sin(c + Math.PI) * 15, 8); cx.stroke();
    cx.beginPath(); cx.moveTo(6, -4); cx.lineTo(6 + Math.sin(c) * 15, 8); cx.stroke();
  } else {
    // gripping arm & legs on trunk (behind body)
    const grip = Math.sin(m.cycle) * 5;
    cx.strokeStyle = furD; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(-2, 12); cx.lineTo(-16, 22 + grip); cx.stroke();  // back leg
    cx.beginPath(); cx.moveTo(2, 14); cx.lineTo(-12, 26 - grip); cx.stroke();   // front leg
    cx.strokeStyle = fur;
    cx.beginPath(); cx.moveTo(-4, -10); cx.lineTo(-20, -16 - grip); cx.stroke(); // back arm holds trunk
  }

  // body
  cx.fillStyle = fur;
  cx.beginPath(); cx.ellipse(0, 4, 15, 19, 0, 0, TAU); cx.fill();
  cx.fillStyle = skin;
  cx.beginPath(); cx.ellipse(3, 8, 9, 12, 0, 0, TAU); cx.fill();

  // head
  cx.fillStyle = fur;
  cx.beginPath(); cx.arc(4, -22, 15, 0, TAU); cx.fill();
  // ears
  cx.beginPath(); cx.arc(-9, -26, 6.5, 0, TAU); cx.arc(15, -28, 6.5, 0, TAU); cx.fill();
  cx.fillStyle = "#E8A9A0";
  cx.beginPath(); cx.arc(-9, -26, 3, 0, TAU); cx.arc(15, -28, 3, 0, TAU); cx.fill();
  // face
  cx.fillStyle = skin;
  cx.beginPath();
  cx.arc(1, -25, 8, 0, TAU);
  cx.arc(10, -25, 8, 0, TAU);
  cx.ellipse(6, -18, 10, 7, 0, 0, TAU);
  cx.fill();
  // eyes (blink)
  const blink = m.blink > 0 ? 0.15 : 1;
  cx.fillStyle = "#26160B";
  cx.save();
  cx.translate(0, -25); cx.scale(1, blink);
  cx.beginPath(); cx.arc(2, 0, 2.6, 0, TAU); cx.arc(11, 0, 2.6, 0, TAU); cx.fill();
  cx.restore();
  // nostrils + smile
  cx.strokeStyle = "#8A5B33"; cx.lineWidth = 2; cx.lineCap = "round";
  cx.beginPath(); cx.arc(6, -17, 4.5, 0.2, Math.PI - 0.2); cx.stroke();
  cx.fillStyle = "#8A5B33";
  cx.beginPath(); cx.arc(4.5, -20.5, 1, 0, TAU); cx.arc(8, -20.5, 1, 0, TAU); cx.fill();

  // hip-tucked clam when carrying one
  if (G.heldClam && !running) drawClamIcon(-15, 8, 0.55, 0.15);

  // throwing arm — aims at the mouse (within the throw cone)
  if (!running) {
    const aim = clampAim(aimAngle());
    // mirror the aim angle across the vertical axis when the sprite is flipped
    let a = f === 1 ? aim.a : Math.PI - aim.a;
    if (m.swingT > 0) {
      a = -1.9 + (1 - m.swingT / 0.25) * 2.7;  // big stick sweep
    } else if (m.throwT > 0) a -= (m.throwT / 0.2) * 1.6; // follow-through
    const ax = 6, ay = -8;
    const hx = ax + Math.cos(a) * 20, hy = ay + Math.sin(a) * 20;
    cx.strokeStyle = fur; cx.lineWidth = 8; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(hx, hy); cx.stroke();
    if (m.swingT > 0) {
      // driftwood stick
      const tx2 = ax + Math.cos(a) * 54, ty2 = ay + Math.sin(a) * 54;
      cx.strokeStyle = "#8A5228"; cx.lineWidth = 7;
      cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(tx2, ty2); cx.stroke();
      cx.strokeStyle = "#B5713A"; cx.lineWidth = 3.5;
      cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(tx2, ty2); cx.stroke();
    } else if (G.state === "play" && m.throwT <= 0) {
      // held ammo
      cx.save();
      cx.translate(hx, hy);
      cx.scale(f, 1); // un-mirror the ammo art
      if (G.cocoCd <= 0 && (keys.KeyE || keys.ShiftLeft)) drawCocoIcon(0, 0, 0.9);
      else drawBananaIcon(0, 0, 0.85, G.t * 2);
      cx.restore();
    }
  } else {
    cx.strokeStyle = fur; cx.lineWidth = 8;
    cx.beginPath(); cx.moveTo(6, -8); cx.lineTo(20, 0); cx.stroke();
  }

  // stun: little stars circling his head
  if (m.stunT > 0) {
    cx.fillStyle = "#FFE14D";
    for (let i = 0; i < 3; i++) {
      const sa = G.t * 8 + i * (TAU / 3);
      cx.save();
      cx.translate(4 + Math.cos(sa) * 16, -44 + Math.sin(sa) * 4);
      cx.rotate(sa);
      cx.beginPath();
      for (let j = 0; j < 5; j++) {
        const a1 = j / 5 * TAU, a2 = a1 + TAU / 10;
        cx.lineTo(Math.cos(a1) * 4.5, Math.sin(a1) * 4.5);
        cx.lineTo(Math.cos(a2) * 2, Math.sin(a2) * 2);
      }
      cx.closePath(); cx.fill();
      cx.restore();
    }
  }
  cx.restore();
}
function drawBananaIcon(x, y, s, rot = 0) {
  cx.save();

  cx.strokeStyle = "#E0A61C"; cx.lineWidth = 10; cx.lineCap = "round";

}
function drawCocoIcon(x, y, s, rot = 0) {

}

// --------------------------- Enemies art --------------------------
function drawEnemy(e) {
  cx.save();
  cx.translate(e.x, e.y);
  const dir = e.flee ? Math.sign(-e.vx) || 1 : Math.sign(e.vx) || -1; // facing
  if (e.flash > 0) { cx.globalAlpha = 1; }
  if (e.kind === "bird") drawBird(e, dir);
  else if (e.kind === "gull") drawGull(e, dir);
  else if (e.kind === "crab") drawCrab(e, dir);
  else if (e.kind === "hermit") drawHermit(e, dir);
  else if (e.kind === "snake") drawSnake(e, dir);
  else if (e.kind === "boss") drawBoss(e, dir);
  else drawBoar(e, dir);
  if (e.flash > 0.4) {
    cx.globalCompositeOperation = "lighter";
    cx.fillStyle = `rgba(255,255,255,${e.flash * 0.5})`;
    cx.beginPath(); cx.arc(0, 0, e.r + 6, 0, TAU); cx.fill();
    cx.globalCompositeOperation = "source-over";
  }
  // hp pips for tanky enemies
  if (e.maxhp > 2 && e.hp < e.maxhp && !e.flee) {
    const bw = e.kind === "boss" ? 72 : 32;
    cx.fillStyle = "rgba(0,0,0,0.35)";
    cx.fillRect(-bw / 2, -e.r - 14, bw, 5);
    cx.fillStyle = "#8CFF6B";
    cx.fillRect(-bw / 2, -e.r - 14, bw * e.hp / e.maxhp, 5);
  }
  cx.restore();
}
function drawBird(e, dir) {
  cx.scale(-dir, 1); // art faces left by default; flip to face travel direction
  const peck = e.state === "attack" ? Math.sin(e.t * 14) * 0.35 : 0;
  const flap = Math.sin(e.t * 12) * 0.9;
  const body = e.diving ? "#6B2E3A" : "#3B3E4A";  // dive-bombers flush angry red
  if (e.diving) {
    cx.strokeStyle = "rgba(255,120,100,0.5)"; cx.lineWidth = 3; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(20, -8); cx.lineTo(34, -14); cx.moveTo(22, 4); cx.lineTo(36, 2); cx.stroke();
  }
  // tail
  cx.fillStyle = "#2E6BD6";
  cx.beginPath(); cx.moveTo(14, -2); cx.lineTo(28, -10); cx.lineTo(26, 4); cx.closePath(); cx.fill();
  // body
  cx.fillStyle = body;
  cx.beginPath(); cx.ellipse(0, 0, 16, 13, 0, 0, TAU); cx.fill();
  cx.fillStyle = "#F7FBFF";
  cx.beginPath(); cx.ellipse(-5, 3, 8, 8, 0, 0, TAU); cx.fill();
  // wing
  cx.save();
  cx.translate(4, -4); cx.rotate(flap * 0.5);
  cx.fillStyle = "#2E3140";
  cx.beginPath(); cx.ellipse(6, 2, 11, 6, 0.4, 0, TAU); cx.fill();
  cx.restore();
  // head + toucan beak
  cx.save();
  cx.translate(-12, -7); cx.rotate(peck);
  cx.fillStyle = body;
  cx.beginPath(); cx.arc(0, 0, 8, 0, TAU); cx.fill();
  cx.fillStyle = "#FFFFFF";
  cx.beginPath(); cx.arc(-2, -1, 3.4, 0, TAU); cx.fill();
  cx.fillStyle = "#26160B";
  cx.beginPath(); cx.arc(-2.6, -1, 1.7, 0, TAU); cx.fill();
  cx.fillStyle = "#FFB03B";
  cx.beginPath();
  cx.moveTo(-6, 0); cx.quadraticCurveTo(-20, -6, -24, 2); cx.quadraticCurveTo(-16, 6, -6, 4);
  cx.closePath(); cx.fill();
  cx.fillStyle = "#FF7A3B";
  cx.beginPath(); cx.moveTo(-6, 3); cx.quadraticCurveTo(-16, 7, -23, 3); cx.quadraticCurveTo(-15, 9, -6, 6); cx.closePath(); cx.fill();
  cx.restore();
  // feet
  cx.strokeStyle = "#FFB03B"; cx.lineWidth = 2.5; cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(-2, 12); cx.lineTo(-2, 16); cx.moveTo(4, 12); cx.lineTo(4, 16); cx.stroke();
}
function drawCrab(e, dir) {
  const wig = Math.sin(e.t * 12) * 3;
  const pinch = e.state === "attack" ? Math.abs(Math.sin(e.t * 10)) * 0.6 : 0.15;
  // legs
  cx.strokeStyle = "#D63A2E"; cx.lineWidth = 3.5; cx.lineCap = "round";
  for (let i = -1; i <= 1; i++) {
    cx.beginPath(); cx.moveTo(i * 8 - 4, 4); cx.lineTo(i * 8 - 9, 13 + (i % 2 ? wig : -wig) * 0.5); cx.stroke();
    cx.beginPath(); cx.moveTo(i * 8 + 4, 4); cx.lineTo(i * 8 + 9, 13 + (i % 2 ? -wig : wig) * 0.5); cx.stroke();
  }
  // body
  cx.fillStyle = "#FF5A4E";
  cx.beginPath(); cx.ellipse(0, 0, 17, 12, 0, 0, TAU); cx.fill();
  cx.fillStyle = "#FF8A78";
  cx.beginPath(); cx.ellipse(0, 4, 11, 6, 0, 0, TAU); cx.fill();
  // claws
  for (const sgn of [-1, 1]) {
    cx.save();
    cx.translate(sgn * 18, -4);
    cx.rotate(sgn * (0.5 - pinch));
    cx.fillStyle = "#D63A2E";
    cx.beginPath(); cx.arc(0, -4, 7, 0, TAU); cx.fill();
    cx.fillStyle = "#FF5A4E";
    cx.beginPath(); cx.arc(0, -4, 7, sgn > 0 ? -0.5 : Math.PI - 0.7, sgn > 0 ? 1.2 : Math.PI + 1, false); cx.lineTo(0, -4); cx.fill();
    cx.restore();
  }
  // eye stalks
  cx.strokeStyle = "#D63A2E"; cx.lineWidth = 2.5;
  cx.beginPath(); cx.moveTo(-5, -9); cx.lineTo(-6, -16); cx.moveTo(5, -9); cx.lineTo(6, -16); cx.stroke();
  cx.fillStyle = "#FFFFFF";
  cx.beginPath(); cx.arc(-6, -18, 4, 0, TAU); cx.arc(6, -18, 4, 0, TAU); cx.fill();
  cx.fillStyle = "#26160B";
  cx.beginPath(); cx.arc(-6 + dir, -18, 2, 0, TAU); cx.arc(6 + dir, -18, 2, 0, TAU); cx.fill();
}
function drawSnake(e, dir) {
  cx.scale(-dir, 1);
  // body segments trailing behind head
  for (let i = 5; i >= 1; i--) {
    const px = i * 9, py = Math.sin(e.t * 10 - i * 1.1) * 5;

  }

  cx.fillStyle = "#6BD44A";
  cx.beginPath(); cx.ellipse(-4, 0, 10, 8, 0, 0, TAU); cx.fill();
  cx.fillStyle = "#FFFFFF";
  cx.beginPath(); cx.arc(-7, -3, 3.2, 0, TAU); cx.fill();
  cx.fillStyle = "#26160B";
  cx.beginPath(); cx.arc(-8, -3, 1.6, 0, TAU); cx.fill();
  // flicking tongue
  if (Math.sin(e.t * 7) > 0.3) {
    cx.strokeStyle = "#FF4E6B"; cx.lineWidth = 2; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(-13, 2); cx.lineTo(-20, 1); cx.moveTo(-20, 1); cx.lineTo(-24, -2); cx.moveTo(-20, 1); cx.lineTo(-24, 4); cx.stroke();

}
function drawBoar(e, dir) {

  cx.beginPath(); cx.moveTo(12, 8); cx.lineTo(12 - gallop * 6, 20); cx.stroke();
  // body
  cx.fillStyle = "#8C7365";
  cx.beginPath(); cx.ellipse(2, 0, 24, 17, 0, 0, TAU); cx.fill();
  // mane
  cx.fillStyle = "#5F4A3E";
  cx.beginPath();
  for (let i = 0; i < 5; i++) cx.arc(14 - i * 7, -12, 6, 0, TAU);
  cx.fill();
  // head
  cx.fillStyle = "#8C7365";
  cx.beginPath(); cx.arc(-18, 2, 12, 0, TAU); cx.fill();

  cx.beginPath(); cx.arc(-30, 5, 1.5, 0, TAU); cx.arc(-26, 5, 1.5, 0, TAU); cx.fill();

  // angry eye
  cx.fillStyle = "#26160B";
  cx.beginPath(); cx.arc(-18, -3, 2.4, 0, TAU); cx.fill();
  cx.strokeStyle = "#3E2A1E"; cx.lineWidth = 2.5;
  cx.beginPath(); cx.moveTo(-24, -8); cx.lineTo(-13, -5); cx.stroke();
  // tail
  cx.strokeStyle = "#6E5A4E"; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(24, -4); cx.quadraticCurveTo(32, -8 + gallop * 3, 30, -1); cx.stroke();
}

// Seagull: white, quick, and only interested in your bananas.
function drawGull(e, dir) {
  cx.scale(-dir, 1);
  const flap = Math.sin(e.t * 18) * 1.1;
  // tail
  cx.fillStyle = "#E8EEF2";
  cx.beginPath(); cx.moveTo(13, -2); cx.lineTo(26, -9); cx.lineTo(24, 4); cx.closePath(); cx.fill();
  // body
  cx.fillStyle = "#FFFFFF";
  cx.beginPath(); cx.ellipse(0, 0, 15, 11, 0, 0, TAU); cx.fill();
  // far wing
  cx.fillStyle = "#C9D6DE";
  cx.save(); cx.translate(2, -3); cx.rotate(-flap * 0.7);
  cx.beginPath(); cx.ellipse(4, 0, 15, 5, 0, 0, TAU); cx.fill();
  cx.restore();
  // head + beak
  cx.fillStyle = "#FFFFFF";
  cx.beginPath(); cx.arc(-11, -7, 7.5, 0, TAU); cx.fill();
  cx.fillStyle = "#FFB03B";
  cx.beginPath(); cx.moveTo(-17, -6); cx.lineTo(-27, -3); cx.lineTo(-17, -1); cx.closePath(); cx.fill();
  cx.fillStyle = "#2B2F38";
  cx.beginPath(); cx.arc(-13, -9, 1.7, 0, TAU); cx.fill();
  // near wing
  cx.fillStyle = "#F2F6F9";
  cx.save(); cx.translate(1, -2); cx.rotate(flap);
  cx.beginPath(); cx.ellipse(2, 0, 17, 6, 0, 0, TAU); cx.fill();
  cx.fillStyle = "#3B3E4A";
  cx.beginPath(); cx.ellipse(15, 0, 5, 4.5, 0, 0, TAU); cx.fill();
  cx.restore();
  // loot in the beak
  if (e.loot > 0) {
    cx.save(); cx.scale(-dir, 1);
    for (let i = 0; i < e.loot; i++) drawBananaIcon(dir * (22 + i * 3), 2 + i * 4, 0.5, 0.5 + i);
    cx.restore();
  }
}
// Hermit crab: wears a shell, so bananas just clank off it.
function drawHermit(e, dir) {
  const wig = Math.sin(e.t * 10) * 2.5;
  const pinch = e.state === "attack" ? Math.abs(Math.sin(e.t * 9)) * 0.5 : 0.15;
  // legs
  cx.strokeStyle = "#8C5A3C"; cx.lineWidth = 3.5; cx.lineCap = "round";
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const lx = sx * (7 + i * 5), ly = 8;
      cx.beginPath();
      cx.moveTo(lx * 0.6, 4);
      cx.quadraticCurveTo(lx, ly + wig * (i % 2 ? 1 : -1), lx + sx * 4, ly + 8);
      cx.stroke();
    }
  }
  // shell — a fat spiral, the reason bananas bounce
  cx.fillStyle = "#C99A5B";
  cx.beginPath(); cx.arc(9, -4, 15, 0, TAU); cx.fill();
  cx.strokeStyle = "#8A6534"; cx.lineWidth = 2.5;
  cx.beginPath();
  for (let a = 0; a < 9; a += 0.12) {
    const r = 2 + a * 1.55;
    const px = 9 + Math.cos(a * 1.5) * r, py = -4 + Math.sin(a * 1.5) * r;
    a === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
  }
  cx.stroke();
  cx.fillStyle = "#E8C48A";
  cx.beginPath(); cx.arc(13, -8, 4, 0, TAU); cx.fill();
  // body poking out
  cx.fillStyle = "#E2673F";
  cx.beginPath(); cx.ellipse(-6, 1, 11, 9, 0, 0, TAU); cx.fill();
  // claw
  cx.save();
  cx.translate(-15, 2); cx.rotate(-pinch);
  cx.fillStyle = "#E2673F";
  cx.beginPath(); cx.ellipse(-4, 0, 7, 5, 0, 0, TAU); cx.fill();
  cx.fillStyle = "#C4502C";
  cx.beginPath(); cx.moveTo(-9, -4); cx.lineTo(-16, -6); cx.lineTo(-9, 0); cx.closePath(); cx.fill();
  cx.restore();
  // eyes on stalks
  cx.strokeStyle = "#E2673F"; cx.lineWidth = 2;
  for (const ex of [-10, -4]) {
    cx.beginPath(); cx.moveTo(ex, -6); cx.lineTo(ex - 1, -13); cx.stroke();
    cx.fillStyle = "#FFFFFF";
    cx.beginPath(); cx.arc(ex - 1, -15, 3, 0, TAU); cx.fill();
    cx.fillStyle = "#2B2F38";
    cx.beginPath(); cx.arc(ex - 1.5, -15, 1.5, 0, TAU); cx.fill();
  }
}
// King Pincher: a crab of unreasonable size wearing a golden kelp crown
function drawBoss(e, dir) {
  cx.save();

  cx.fillStyle = "#FFD23B";
  cx.beginPath();

  cx.moveTo(9, -16);   cx.lineTo(11, -27);  cx.lineTo(13, -16);
  cx.closePath(); cx.fill();
  cx.fillRect(-14, -17, 28, 3);
  cx.fillStyle = "#E0A61C";
  cx.beginPath(); cx.arc(0, -25, 1.8, 0, TAU); cx.fill();

}

// --------------------------- Clam art -----------------------------
function drawClamIcon(x, y, s, open = 0.5, rot = 0) {
  cx.save();

function drawClamPickup() {
  const x = TREE_X + 46, y = GROUND - 8;

  for (let i = 0; i < 4; i++) { cx.rotate(TAU / 4); cx.lineTo(0, -5); cx.lineTo(1.5, -1.5); }
  cx.closePath(); cx.fill();
  cx.restore();
}

// --------------------------- Shots art ----------------------------
function drawShot(s) {
  if (s.kind === "banana") drawBananaIcon(s.x, s.y, 1, s.spin);
  else if (s.kind === "clam") drawClamIcon(s.x, s.y, 1, 0.12, s.spin);
  else drawCocoIcon(s.x, s.y, 1.05, s.spin);
}
// The King's arrival: the beach dims from the edges and his name looms over
// the surf while he marches in. Non-blocking — the wave is already running.
function drawKingEntrance() {
  if (G.kingEntrance <= 0) return;
  const t = 1 - G.kingEntrance / 2.6;              // 0 -> 1 across the entrance
  const fade = Math.min(1, Math.min(t * 5, (1 - t) * 4));
  cx.save();
  cx.globalAlpha = fade * 0.55;
  const g = cx.createRadialGradient(W * 0.72, GROUND - 40, 60, W * 0.72, GROUND - 40, W * 0.8);
  g.addColorStop(0, "rgba(0,0,0,0)");

  cx.fillStyle = g;

  cx.globalAlpha = fade * 0.5;

    const rt = (t * 1.6 + i * 0.5) % 1;

// Milestone confetti — falls from the top of the screen for a couple of

const confetti = [];
for (let i = 0; i < 70; i++)

                  w: rnd(5, 11), h: rnd(7, 14), rot: rnd(TAU), spin: rnd(-6, 6),
                  color: pick(["#FFD23B", "#FF8A5C", "#8CFF6B", "#7FE3FF", "#FF9CCB", "#FFFFFF"]) });
function drawConfetti() {

// Dusk tint for NIGHTFALL waves — fades in and out with G.night so the
// transition never snaps.
const stars = [];
for (let i = 0; i < 44; i++) stars.push({ x: rnd(W), y: rnd(20, 330), s: rnd(0.7, 1.9), tw: rnd(TAU) });
function drawNight() {
  if (G.night <= 0.01) return;
  const n = G.night;
  cx.save();
  cx.globalAlpha = n * 0.62;
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0B1E46");
  g.addColorStop(0.6, "#12335C");
  g.addColorStop(1, "#0A2740");
  cx.fillStyle = g;
  cx.fillRect(0, 0, W, H);
  cx.globalAlpha = n;
  cx.fillStyle = "#FFFFFF";
  for (const st of stars) {
    const a = 0.35 + 0.45 * Math.sin(G.t * 2 + st.tw);
    cx.globalAlpha = n * a;
    cx.beginPath(); cx.arc(st.x, st.y, st.s, 0, TAU); cx.fill();

}
// Wind streaks, so a bent throw looks deliberate rather than broken.
function drawWind() {
  if (!G.wind) return;
  const dir = Math.sign(G.wind);
  cx.save();
  cx.strokeStyle = "rgba(255,255,255,0.32)";
  cx.lineWidth = 2; cx.lineCap = "round";
  for (let i = 0; i < 9; i++) {
    const seed = i * 137.5;
    const y = 60 + ((seed * 3.1) % (GROUND - 90));
    const span = 40 + (seed % 50);
    const x = (G.t * (120 + (seed % 80)) * dir + seed * 7) % (W + 260) * 1;
    const px = dir > 0 ? x - 130 : W + 130 - x;
    cx.globalAlpha = 0.25 + 0.2 * Math.sin(G.t * 3 + i);
    cx.beginPath(); cx.moveTo(px, y); cx.lineTo(px + span * dir, y); cx.stroke();
  }
  cx.restore();
}

// Blend two hex colours, so the aim dots cross-fade with the night tint
// instead of snapping when a NIGHTFALL wave rolls in.
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(((pa >> sh) & 255) + ((((pb >> sh) & 255) - ((pa >> sh) & 255)) * t));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function drawTrajectory() {
  if (G.state !== "play" || G.paused || !opts.preview) return;
  if (touchMode && !touchAim.active) return;   // only while a finger is aiming
  const h = handPos(), aim = clampAim(aimAngle());
  const a = aim.a;
  const coco = G.cocoCd <= 0 && (keys.KeyE || keys.ShiftLeft);
  const sp = coco ? 500 : 640, g = coco ? 1500 : 1050;
  let x = h.x, y = h.y, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
  // The arc crosses bright sky, dark trunk, sea and sand, so each dot is a
  // solid ink dot inside a contrasting rim — readable over any of them.
  // Ink goes dark on a bright beach and pale under a night sky; red always
  // means the aim hit the edge of the throw cone and was clamped.
  const n = G.night;
  const ink = aim.clamped ? mixHex("#B3170B", "#FF9081", n)
    : coco ? mixHex("#3A1E06", "#FFD9A0", n)
           : mixHex("#123039", "#FFF7D2", n);
  const rim = n > 0.5 ? `rgba(6,16,32,${0.5 + n * 0.3})` : `rgba(255,255,255,${0.85 - n * 0.6})`;
  const step = 0.05;
  for (let i = 0; i < 14; i++) {
    vy += g * step; vx += G.wind * step; x += vx * step; y += vy * step;
    if (y > GROUND) break;
    const r = 3.8 - i * 0.09;   // tapers to show distance, but stays legible
    cx.fillStyle = rim;
    cx.beginPath(); cx.arc(x, y, r + 1.7, 0, TAU); cx.fill();
    cx.fillStyle = ink;
    cx.globalAlpha = 0.95 - i * 0.015;
    cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }
}

// -------------------------- Particles art --------------------------
function drawParticles() {
  for (const p of G.parts) {
    const a = 1 - p.t / p.life;
    cx.save();
    cx.translate(p.x, p.y);
    cx.globalAlpha = clamp(a, 0, 1);
    cx.rotate(p.rot);
    cx.fillStyle = p.color;
    switch (p.kind) {
      case "circle": cx.beginPath(); cx.arc(0, 0, 4, 0, TAU); cx.fill(); break;
      case "star": {
        cx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a1 = i / 5 * TAU, a2 = a1 + TAU / 10;
          cx.lineTo(Math.cos(a1) * 6, Math.sin(a1) * 6);
          cx.lineTo(Math.cos(a2) * 2.6, Math.sin(a2) * 2.6);
        }
        cx.closePath(); cx.fill(); break;
      }
      case "leaf": cx.beginPath(); cx.ellipse(0, 0, 8, 3.5, 0, 0, TAU); cx.fill(); break;
      case "feather": cx.beginPath(); cx.ellipse(0, 0, 7, 2.6, 0.5, 0, TAU); cx.fill(); break;
      case "chip": cx.fillRect(-4, -2.5, 8, 5); break;
      case "dust": cx.globalAlpha = a * 0.7; cx.beginPath(); cx.arc(0, 0, 6 + p.t * 18, 0, TAU); cx.fill(); break;
      case "ring":
        cx.strokeStyle = p.color; cx.lineWidth = 4 * a;
        cx.beginPath(); cx.arc(0, 0, 10 + p.t * 190, 0, TAU); cx.stroke(); break;
    }
    cx.restore();
  }
  cx.globalAlpha = 1;
}
function drawFloats() {
  for (const f of G.floats) {

    cx.globalAlpha = clamp(a * 1.4, 0, 1);

  cx.globalAlpha = 1;

function txt(str, x, y, size, color, align = "left", outline = true, weight = "bold") {

}

  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}
